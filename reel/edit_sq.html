<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>infoakademi reel kare (web)</title>
<style>html,body{margin:0;background:#000;height:100%}body{display:grid;place-items:center}canvas{max-width:100vw;max-height:100vh}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/*
 * infoakademi — konuşan kişi kurgusu, KOYU tema, KARE web sürümü (1080×1080, 30 fps, 20 sn)
 * Dikey (edit2.html) kompozisyonun 1080×1920 sanal sahnesi çizilir, y = OY…OY+S penceresi kare çıktıya alınır.
 * Web için Instagram yorum/DM kapanışı yok: "kayıtlar açık"tan sonra program adlarıyla marka kapanışı.
 * Referans stil: karanlık sinematik ton, duyguya göre renk (kırmızı/mavi/yeşil), neon çerçeve, glitch, dev dar başlıklar
 * Katmanlar: video → "arka" yazılar → kişi (maske ile kesilmiş) → ön grafikler / tam ekran sahneler
 * Kelime zamanları, sessizlik analizindeki duraklamalara göre (kesilmiş zaman çizelgesinde).
 */
const Q = new URLSearchParams(location.search);
const W = 1080, H = 1920, FPS = 30, DUR = 20;
const S = 1080, OY = 60;                           // kare pencere: sanal sahnede y = OY…OY+S
const sy = f => OY + f * S;                        // pencere oranından sanal y
const RENDER = Q.has('render');
const NF = 526;                                    // kesilmiş video kare sayısı
const VEND = 14.5;                                 // konuşma "kayıtlar açık" ile biter (yorum çağrısı web'de yok)
const cx = W / 2, cy = OY + S / 2;

const C = { lime: '#D8F53C', yellow: '#FFD84D', blue: '#2F6BF2', coral: '#FF5A36', pink: '#FF4FA3', ink: '#0E0F13', cream: '#F4F1EA', white: '#FFFFFF' };
const out = document.getElementById('c'); out.width = W; out.height = S;
const octx = out.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const buf = mk(), ctx = buf.getContext('2d');
const per = mk(), pctx = per.getContext('2d');      // kesilmiş kişi

// ---------- yardımcılar ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  outCubic: x => 1 - Math.pow(1 - x, 3), inCubic: x => x * x * x,
  outQuint: x => 1 - Math.pow(1 - x, 5),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outBack: (x, s = 1.70158) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
  inBack: (x, s = 1.70158) => (s + 1) * x * x * x - s * x * x,
  outElastic: x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI) / 3) + 1,
};
const win = (t, a, b, c, d) => E.inOutCubic(prog(t, a, b)) * (1 - E.inOutCubic(prog(t, c, d)));
const up = s => s.toLocaleUpperCase('tr-TR');
function setFont(g, fam, size, weight = 400) {
  g.font = fam === 'serif' ? `italic 400 ${size}px "Instrument Serif"` : fam === 'anton' ? `400 ${size}px Anton` : `${Math.round(weight)} ${size}px Inter`;
}
function measure(g, s, fam, size, weight, track = 0) { setFont(g, fam, size, weight); g.letterSpacing = `${track * size}px`; const w = g.measureText(s).width; g.letterSpacing = '0px'; return w; }
function text(g, s, x, y, fam, size, weight, color, align = 'left', track = 0, alpha = 1) {
  g.save(); setFont(g, fam, size, weight); g.letterSpacing = `${track * size}px`; g.textAlign = align; g.fillStyle = color; g.globalAlpha *= alpha; g.fillText(s, x, y); g.restore();
}
function rrect(g, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function circle(g, x, y, r, fill) { if (r <= 0) return; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); }
function hexA(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
function arrowCursor(g, x, y, s = 1, a = 1, pressed = 0) {
  if (a <= 0) return;
  g.save(); g.translate(x, y); g.scale(1.9 * s * (1 - pressed * .12), 1.9 * s * (1 - pressed * .12)); g.globalAlpha *= a;
  g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 8; g.shadowOffsetY = 3;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 24); g.lineTo(6, 18.5); g.lineTo(10.5, 28); g.lineTo(14.5, 26.2); g.lineTo(10.2, 17); g.lineTo(17.5, 17); g.closePath();
  g.shadowColor = '#2F7BFF'; g.shadowBlur = 18; g.fillStyle = '#3D8BFF'; g.fill(); g.shadowColor = 'transparent'; g.lineWidth = 1.6; g.strokeStyle = '#BFD8FF'; g.lineJoin = 'round'; g.stroke(); g.restore();
}
function click(g, x, y, t, T) {
  const p = prog(t, T, T + .45); if (p <= 0 || p >= 1) return;
  g.save(); g.globalAlpha = 1 - p; g.strokeStyle = C.lime; g.lineWidth = 5 * (1 - p) + 1;
  g.beginPath(); g.arc(x, y, 14 + p * 60, 0, Math.PI * 2); g.stroke(); g.restore();
}
function tap(g, x, y, t, T, r = 46) {
  if (t < T - .3 || t > T + .6) return;
  const a = prog(t, T - .3, T - .12) * (1 - prog(t, T + .18, T + .42));
  const s = E.outBack(prog(t, T - .3, T - .1)) * (1 - .18 * Math.sin(prog(t, T - .04, T + .16) * Math.PI));
  g.save(); g.globalAlpha = a; circle(g, x, y, r * s, 'rgba(255,255,255,.45)');
  g.lineWidth = 3; g.strokeStyle = 'rgba(255,255,255,.8)'; g.beginPath(); g.arc(x, y, r * s, 0, Math.PI * 2); g.stroke(); g.restore();
  const rp = prog(t, T, T + .5);
  if (rp > 0 && rp < 1) { g.save(); g.globalAlpha = (1 - rp) * .8; g.lineWidth = 5 * (1 - rp) + 1; g.strokeStyle = '#fff'; g.beginPath(); g.arc(x, y, r + E.outCubic(rp) * 80, 0, Math.PI * 2); g.stroke(); g.restore(); }
}

// ---------- kelime zamanları ----------
function words(str, a, b) {
  const ws = str.split(' ');
  const wt = ws.map(w => Math.max(1, (w.match(/[aeıioöuüAEIİOÖUÜ]/g) || []).length));
  const tot = wt.reduce((x, y) => x + y, 0);
  let acc = 0;
  return ws.map((w, i) => { const t = a + (b - a) * acc / tot; acc += wt[i]; return { w, t }; });
}

// ---------- video kareleri ----------
const cache = new Map();
function loadBitmap(url) { return fetch(url).then(r => r.blob()).then(b => createImageBitmap(b)); }
async function frameAt(i) {
  i = Math.max(1, Math.min(NF, i));
  if (cache.has(i)) return cache.get(i);
  const p = Promise.all([loadBitmap(`work/frames/${String(i).padStart(5, '0')}.jpg`), loadBitmap(`work/masks/${String(i).padStart(5, '0')}.png`)]);
  cache.set(i, p);
  if (cache.size > 8) { const k = cache.keys().next().value; cache.get(k).then(([a, b]) => { a.close(); b.close(); }); cache.delete(k); }
  return p;
}

// bölüm rengi (duyguya göre ortam ışığı)
const SEC = [[0, '#FF2E3A'], [3.8, '#2F7BFF'], [10.87, '#FFC83D'], [12.0, '#2EE86B'], [14.5, '#C8FF3D']];
function secColor(t) { let c = SEC[0][1]; for (const [a, col] of SEC) if (t >= a) c = col; return c; }
const rimC = mk(), rctx = rimC.getContext('2d');
function neonFrame(t, col) {
  const on = .85 + .15 * Math.sin(t * 40) * (Math.sin(t * 7) > .8 ? 1 : 0);
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  const ag = ctx.createRadialGradient(W * .62, H * .28, 0, W * .62, H * .28, H * .5);
  ag.addColorStop(0, hexA(col, .38)); ag.addColorStop(1, hexA(col, 0)); ctx.fillStyle = ag; ctx.fillRect(0, 0, W, H);
  const bg2 = ctx.createRadialGradient(W / 2, sy(1.05), 0, W / 2, sy(1.05), S * .6);
  bg2.addColorStop(0, hexA(col, .3)); bg2.addColorStop(1, hexA(col, 0)); ctx.fillStyle = bg2; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  ctx.save(); ctx.translate(W * .74, H * .2); ctx.rotate(-.5 + t * .05);
  for (const [lw, a] of [[46, .1], [20, .3], [7, 1]]) { ctx.strokeStyle = col; ctx.globalAlpha = a * on; ctx.lineWidth = lw; ctx.shadowColor = col; ctx.shadowBlur = 50; ctx.strokeRect(-240, -240, 480, 480); }
  ctx.restore();
  ctx.save(); ctx.translate(W * .1, H * .12); ctx.rotate(.6); ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.shadowColor = col; ctx.shadowBlur = 40; ctx.globalAlpha = .8 * on;
  ctx.beginPath(); ctx.moveTo(-160, 0); ctx.lineTo(160, 0); ctx.stroke(); ctx.restore();
}
function rimLight(col) {
  rctx.clearRect(0, 0, W, H); rctx.globalCompositeOperation = 'source-over'; rctx.drawImage(per, 0, 0);
  rctx.globalCompositeOperation = 'source-in'; rctx.fillStyle = col; rctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.filter = 'blur(24px)'; ctx.globalAlpha = .85; ctx.drawImage(rimC, 0, 0); ctx.restore();
}
// kısa glitch (bölüm geçişlerinde)
const GL = [3.8, 5.95, 8.28, 10.87, 12.0, 14.5];
const gl = mk(), gctx = gl.getContext('2d');
function glitch(t) {
  let T = null; for (const g0 of GL) if (t >= g0 - .02 && t < g0 + .14) T = g0;
  if (T === null) return;
  const k = 1 - prog(t, T, T + .14);
  gctx.clearRect(0, 0, W, H); gctx.drawImage(buf, 0, 0);
  let seed = Math.floor(t * 60) * 97;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 9; i++) {
    const y = rnd() * H, h = 20 + rnd() * 140, dx = (rnd() - .5) * 90 * k;
    ctx.drawImage(gl, 0, y, W, h, dx, y, W, h);
  }
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .35 * k;
  ctx.drawImage(gl, 14 * k, 0); ctx.fillStyle = 'rgba(255,0,60,.25)'; ctx.fillRect(0, 0, W, H); ctx.restore();
}
// kamera: kişinin yüzüne göre zoom
const FACE = [W * .58, H * .32];
function camera(t) {
  let z = 1 + .38 * E.outExpo(prog(t, .05, .6)) - .38 * E.inOutCubic(prog(t, 1.5, 2.05));
  if (t >= 3.78 && t < 8.3) z *= 1.06;                  // kesme noktasında hafif fark (jump cut gizler)
  if (t >= 10.89 && t < 11.97) z *= 1.14;
  if (t >= 11.97 && t < VEND) z *= 1 + .1 * E.inOutCubic(prog(t, 14.4, 17.4));
  z *= 1 + .012 * Math.sin(t * .8);
  return z;
}
function drawVideo(img, mask, t) {
  const z = camera(t);
  const tr = g => { g.translate(FACE[0], FACE[1]); g.scale(z, z); g.translate(-FACE[0], -FACE[1]); };
  ctx.save(); tr(ctx); ctx.filter = 'brightness(.3) saturate(.55) contrast(1.25) blur(1.5px)'; ctx.drawImage(img, 0, 0, W, H); ctx.restore();
  ctx.fillStyle = 'rgba(4,8,24,.5)'; ctx.fillRect(0, 0, W, H);
  pctx.clearRect(0, 0, W, H);
  pctx.save(); tr(pctx); pctx.filter = 'contrast(1.18) saturate(.85) brightness(.98)'; pctx.drawImage(img, 0, 0, W, H); pctx.restore();
  pctx.save(); pctx.globalCompositeOperation = 'destination-in'; tr(pctx); pctx.drawImage(mask, 0, 0, W, H); pctx.restore();
}
function vignette(a = .45) {
  const g = ctx.createRadialGradient(cx, cy * .95, S * .3, cx, cy, S * .75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- giriş: belli belirsiz yanan sayfa (film burn) ----------
function burn(t) {
  const a = win(t, 0, .12, .55, 1.25) * .5;
  if (a <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  const fl = .85 + .15 * Math.sin(t * 53) * Math.sin(t * 31);
  const spots = [[-.05, .15 + t * .1, '#FF6A1A', .75], [1.05, .05 + t * .2, '#FFB23D', .6], [.2 + t * .3, 1.02, '#FF3B1F', .55], [1.02, .7 - t * .2, '#FFCF6A', .45]];
  for (const [sx, sy, col, r] of spots) {
    const x = sx * W, y = OY + sy * S, rr = r * W * (1 + t * .5);
    const g = ctx.createRadialGradient(x, y, 0, x, y, rr);
    g.addColorStop(0, hexA(col, a * fl)); g.addColorStop(.45, hexA(col, a * fl * .45)); g.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  // çapraz ışık sızıntısı
  const lp = prog(t, .05, .9);
  ctx.translate(W * lerp(-.3, 1.1, lp), 0); ctx.rotate(.35);
  const lg = ctx.createLinearGradient(-160, 0, 160, 0);
  lg.addColorStop(0, 'rgba(255,190,90,0)'); lg.addColorStop(.5, `rgba(255,200,120,${a * .5})`); lg.addColorStop(1, 'rgba(255,190,90,0)');
  ctx.fillStyle = lg; ctx.fillRect(-160, -H, 320, H * 3);
  ctx.restore();
}

// ---------- kafanın arkasındaki dev yazı ----------
function behind(str, t, a, b, y, opt = {}) {
  if (t < a || t > b + .16) return;
  const fam = opt.fam || 'anton', weight = opt.weight || 400;
  const s = opt.upper === false ? str : up(str);
  let size = (opt.size || 360) * .85;               // kare pencerede üstten taşmasın
  y += 34;
  const w0 = measure(ctx, s, fam, size, weight, opt.track ?? 0);
  if (w0 > W * .94) size *= W * .94 / w0;
  const chars = [...s];
  let x = cx - measure(ctx, s, fam, size, weight, opt.track ?? 0) / 2;
  const outp = E.inCubic(prog(t, b, b + .15));
  ctx.save();
  chars.forEach((ch, i) => {
    const cw = measure(ctx, ch, fam, size, weight, opt.track ?? 0);
    const p = E.outExpo(prog(t, a + i * .028, a + .55 + i * .028));
    const dy = (1 - p) * size * .9 + outp * size * .5 * (1 + (i % 3) * .3);
    const col = typeof opt.color === 'function' ? opt.color(i, chars.length) : (opt.color || '#fff');
    ctx.save(); ctx.globalAlpha = clamp(p * 1.5) * (1 - outp);
    ctx.beginPath(); ctx.rect(x - 5, y - size * 1.1, cw + 10, size * 1.35); ctx.clip();
    ctx.shadowColor = opt.glow || 'rgba(255,255,255,.5)'; ctx.shadowBlur = 40;
    text(ctx, ch, x, y + dy, fam, size, weight, col, 'left', opt.track ?? 0);
    ctx.restore();
    x += cw;
  });
  ctx.restore();
}

// ---------- ön altyazılar ----------
// sayfa: { a, b, y, ws:[{w,t,acc?,hl?}], hl: renk }
function caption(pg, t) {
  if (t < pg.a - .05 || t > pg.b + .2) return;
  const base = pg.size || 150, col = pg.col || secColor(Math.max(pg.a, .01));
  const o = E.inCubic(prog(t, pg.b, pg.b + .15));
  const items = pg.ws.map(w => ({ ...w, s: up(w.w) }));
  const gap = base * .2, maxW = W * .92;
  // satırlara böl, sonra her satırı genişliğe sığdır
  const lines = []; let cur = [], cw = 0;
  for (const it of items) { it.wd = measure(ctx, it.s, 'anton', base, 400); if (cur.length && cw + gap + it.wd > maxW) { lines.push(cur); cur = []; cw = 0; } cur.push(it); cw += (cur.length > 1 ? gap : 0) + it.wd; }
  if (cur.length) lines.push(cur);
  ctx.save(); ctx.globalAlpha = 1 - o;
  let y = pg.y;
  lines.forEach((ln, li) => {
    const raw = ln.reduce((s, it) => s + it.wd, 0) + gap * (ln.length - 1);
    const k = Math.min(1.25, maxW / raw) * (ln.some(it => it.acc) ? 1 : .92);
    const size = base * k, lw = raw * k;
    let x = cx - lw / 2;
    y += li ? size * 1.0 : 0;
    for (const it of ln) {
      const wd = it.wd * k;
      const p = prog(t, it.t - .03, it.t + .16);
      if (p > 0) {
        const sc = lerp(1.45, 1, E.outCubic(p)), sh = (1 - p) * 10 * Math.sin(t * 90);
        const fill = it.acc ? col : '#FFFFFF';
        ctx.save(); ctx.translate(x + wd / 2 + sh, y - size * .35); ctx.scale(sc, sc); ctx.translate(-(x + wd / 2), -(y - size * .35));
        ctx.globalAlpha *= clamp(p * 2);
        setFont(ctx, 'anton', size, 400);
        ctx.shadowColor = it.acc ? col : 'rgba(255,255,255,.45)'; ctx.shadowBlur = size * (it.acc ? .5 : .25);
        ctx.fillStyle = fill; ctx.globalAlpha *= .6; ctx.fillText(it.s, x, y);
        ctx.globalAlpha /= .6; ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8; ctx.fillText(it.s, x, y);
        ctx.restore();
      }
      x += wd + gap * k;
    }
  });
  ctx.restore();
}

// konuşma → sayfalar (kesilmiş zaman çizelgesi)
const W1 = words('Grafik tasarım öğrenmek istiyorsun', .12, 1.62);
const W2 = words('ama nereden başlayacağını bilmiyor musun?', 1.87, 3.62);
const W6a = words('Hepsini sıfırdan,', 6.04, 6.9), W6b = words('canlı derslerle öğretiyoruz.', 7.0, 8.15);
const W7a = words('Gerçek projelerle', 8.42, 9.55), W7b = words('portfolyonu oluştur,', 9.72, 10.75);
const W9 = words('sertifikanı al.', 11.01, 11.8);
const W10 = words("infoakademi'de kayıtlar açık.", 12.09, 14.4);
const acc = (ws, i) => { ws[i] = { ...ws[i], acc: true }; return ws; };
const CAP = sy(.8), CAPF = sy(.8);                // konuşma / tam ekran altyazı tabanı
const PAGES = [
  { a: .75, b: 1.78, y: CAP, size: 130, ws: acc(W1.slice(2), 1) },
  { a: 1.85, b: 2.42, y: CAP, size: 130, ws: W2.slice(0, 2) },
  { a: 2.42, b: 3.1, y: CAP, size: 130, ws: acc(W2.slice(2, 3), 0) },
  { a: 3.1, b: 3.78, y: CAP, size: 130, ws: acc(W2.slice(3), 1) },
  { a: 6.0, b: 6.95, y: CAPF, ws: W6a, size: 100, col: C.lime },
  { a: 6.98, b: 8.28, y: CAPF, ws: acc(W6b, 0), size: 100, col: C.lime },
  { a: 8.38, b: 9.62, y: CAPF, ws: acc(W7a, 1), size: 100, col: '#4D9BFF' },
  { a: 9.66, b: 10.85, y: CAPF, ws: acc(W7b, 0), size: 100, col: '#4D9BFF' },
  { a: 10.95, b: 11.95, y: CAP, size: 130, ws: acc(W9, 0) },
  { a: 13.2, b: 14.42, y: CAP, size: 130, ws: acc(W10.slice(1), 1) },
];

// ---------- ön grafikler (yüz sahneleri) ----------
function questionMarks(t) {
  const Qs = [[.14, .42, 2.12, C.yellow, -.2], [.86, .46, 2.55, C.lime, .25], [.16, .6, 3.2, C.coral, .15]];
  for (const [x, y, T, col, r] of Qs) {
    const p = E.outBack(prog(t, T, T + .3), 2.5) * (1 - E.inBack(prog(t, 3.62, 3.82)));
    if (p <= 0) continue;
    ctx.save(); ctx.translate(x * W, sy(y) + Math.sin(t * 3 + x * 10) * 8); ctx.rotate(r + Math.sin(t * 2 + y) * .06); ctx.scale(p, p);
    circle(ctx, 0, 0, 62, col);
    text(ctx, '?', 0, 38, 'anton', 110, 400, '#111', 'center');
    ctx.restore();
  }
  // kararsız imleç
  const ca = prog(t, 1.95, 2.1) * (1 - prog(t, 3.55, 3.75));
  if (ca > 0) {
    const tt = t - 1.95;
    const x = W * (.5 + .28 * Math.sin(tt * 2.1) * Math.cos(tt * .7)), y = sy(.52 + .08 * Math.sin(tt * 3.3));
    ctx.save(); ctx.globalAlpha = ca * .6; ctx.setLineDash([6, 10]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let k = 0; k <= 30; k++) { const s = Math.max(0, tt - .8 + k * .8 / 30); const px = W * (.5 + .28 * Math.sin(s * 2.1) * Math.cos(s * .7)), py = sy(.52 + .08 * Math.sin(s * 3.3)); k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.stroke(); ctx.restore();
    arrowCursor(ctx, x, y, 1, ca);
  }
}
function typeTag(t) {
  const p = win(t, 3.95, 4.15, 4.5, 4.62);
  if (p <= 0) return;
  ctx.save(); ctx.globalAlpha = p; ctx.translate(W * .2, sy(.55)); ctx.rotate(-.08); ctx.scale(lerp(.8, 1, p), lerp(.8, 1, p));

  ctx.save();
  const s = .3;
  const x = side > 0 ? W - W * s * .95 : -W * s * .12, y = OY + S - H * s * .6 + (1 - p) * S * .5;
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(255,255,255,.9)'; ctx.shadowBlur = 0;
  // beyaz kontur: 8 yönde kaydırılmış kopyalar
  for (let k = 0; k < 8; k++) { const a2 = k / 8 * Math.PI * 2; ctx.save(); ctx.translate(Math.cos(a2) * 12, Math.sin(a2) * 12); ctx.filter = 'brightness(0) invert(1)'; ctx.drawImage(per, 0, 0); ctx.restore(); }
  ctx.drawImage(per, 0, 0);
  ctx.restore();
}

// ---------- son: infoakademi + programlar ----------
const FIN = 14.45;
const PROGS = [['Photoshop', '#31A8FF'], ['Illustrator', '#FF9A00'], ['InDesign', '#FF3D7F']];
function finale(t) {
  const a = E.outCubic(prog(t, FIN, FIN + .3));
  ctx.save(); ctx.globalAlpha = a; darkGrid(t, '#2F7BFF'); ctx.restore();
  if (t < FIN + .12) return;
  ctx.save(); ctx.translate(0, OY);
  const base = 330;
  // marka yazısı harf harf
  const s = 'infoakademi', size = 150;
  const tw = measure(ctx, s, 'inter', size, 800, -.045);
  let x = cx - tw / 2;
  [...s].forEach((ch, i) => {
    const T = FIN + .15 + i * .045;
    const p = E.outExpo(prog(t, T, T + .6));
    const wgt = lerp(200, 800, E.outCubic(prog(t, T, T + .5)));
    const cw = measure(ctx, ch, 'inter', size, 800, -.045);
    ctx.save(); ctx.beginPath(); ctx.rect(x - 10, base - size, cw + 20, size * 1.35); ctx.clip();
    ctx.shadowColor = '#2F7BFF'; ctx.shadowBlur = 40;
    text(ctx, ch, x + cw / 2, base + (1 - p) * size * 1.2, 'inter', size, wgt, i < 4 ? '#FFFFFF' : '#9DB8FF', 'center', -.02);
    ctx.restore(); x += cw;
  });
  const lp = E.inOutCubic(prog(t, FIN + .6, FIN + 1.1));
  ctx.fillStyle = C.blue; ctx.fillRect(cx - tw / 2, base + 50, tw * lp, 5);
  text(ctx, 'online grafik tasarım eğitimi', cx, base + 125, 'inter', 38, 500, '#8C96B8', 'center', .06, prog(t, FIN + .7, FIN + 1.1));
  // programlar
  text(ctx, up('eğitimde kullanacağın programlar'), cx, base + 238, 'inter', 22, 700, '#5E6A90', 'center', .16, prog(t, FIN + 1.15, FIN + 1.45));
  const ph = 88, gap = 22;
  const ws = PROGS.map(([n]) => measure(ctx, n, 'inter', 38, 800, -.02) + 112);
  let px = cx - (ws.reduce((a2, b2) => a2 + b2, 0) + gap * 2) / 2;
  PROGS.forEach(([n, col], i) => {
    const T = FIN + 1.35 + i * .25, p = E.outBack(prog(t, T, T + .35), 1.8);
    const w = ws[i], y = base + 290;
    if (p > 0) {
      ctx.save(); ctx.translate(px + w / 2, y + ph / 2); ctx.scale(p, p); ctx.translate(-(px + w / 2), -(y + ph / 2));
      ctx.globalAlpha = clamp(p * 1.4);
      rrect(ctx, px, y, w, ph, ph / 2); ctx.fillStyle = hexA(col, .14); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 26; ctx.stroke(); ctx.shadowBlur = 0;
      circle(ctx, px + 46, y + ph / 2, 12, col);
      text(ctx, n, px + 72, y + ph / 2 + 13, 'inter', 38, 800, '#fff', 'left', -.02);
      ctx.restore();
    }
    px += w + gap;
  });
  // çağrı
  const cp = E.outBack(prog(t, FIN + 2.55, FIN + 2.9), 1.6);
  if (cp > 0) {
    const label2 = 'KAYITLAR AÇIK', w = measure(ctx, label2, 'anton', 64, 400, .04) + 120, y = base + 470;
    ctx.save(); ctx.translate(cx, y); ctx.scale(cp, cp); ctx.rotate(-.03 * (1 - cp));
    ctx.shadowColor = hexA(C.lime, .6); ctx.shadowBlur = 40;
    rrect(ctx, -w / 2, -52, w, 104, 52); ctx.fillStyle = C.lime; ctx.fill(); ctx.shadowBlur = 0;
    text(ctx, label2, 0, 24, 'anton', 64, 400, '#111', 'center', .04);
    ctx.restore();
    // parıltı
    const sh = prog(t, FIN + 3.1, FIN + 3.6);
    if (sh > 0 && sh < 1) {
      ctx.save(); rrect(ctx, cx - w / 2, y - 52, w, 104, 52); ctx.clip(); ctx.translate(cx + lerp(-w, w, sh), y); ctx.rotate(.4);
      const g = ctx.createLinearGradient(-50, 0, 50, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.7)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(-50, -200, 100, 400); ctx.restore();
    }
  }
  ctx.restore();
}

// ---------- sahne ----------
async function drawScene(t) {
  const fi = Math.min(NF, Math.floor(t * FPS) + 1);
  const [img, mask] = await frameAt(fi);
  ctx.save(); ctx.letterSpacing = '0px';
  const full = (t >= 6.0 && t < 10.87);
  if (t < VEND) {
    drawVideo(img, mask, t);
    const sc = secColor(t);
    neonFrame(t, sc);
    vignette(.65);
    // arka yazılar
    behind('Grafik', t, .1, 1.72, H * .148, { color: '#fff', size: 250, glow: '#FF2E3A' });
    behind('Tasarım', t, .36, 1.72, H * .255, { color: (i) => i % 2 ? '#FF2E3A' : '#fff', size: 250, glow: '#FF2E3A' });
    behind('Tipografi', t, 3.86, 4.47, H * .205, { color: '#fff', size: 360, glow: '#2F7BFF' });
    behind('Renk', t, 4.62, 4.98, H * .215, { color: (i) => [C.coral, C.yellow, C.lime, C.pink][i % 4], size: 400 });
    behind('Kompozisyon', t, 5.1, 5.9, H * .19, { color: '#fff', size: 300, glow: '#2F7BFF' });
    behind('infoakademi', t, 12.02, 13.2, H * .19, { fam: 'inter', weight: 900, upper: false, track: -.05, color: (i) => i < 4 ? '#fff' : '#2EE86B', size: 240, glow: '#2EE86B' });
    rimLight(sc);
    ctx.drawImage(per, 0, 0);
    // yazı arkası koyu bant
    const tb = ctx.createLinearGradient(0, sy(.5), 0, sy(1)); tb.addColorStop(0, 'rgba(0,0,0,0)'); tb.addColorStop(.5, 'rgba(0,0,0,.5)'); tb.addColorStop(1, 'rgba(0,0,0,.35)');
    ctx.fillStyle = tb; ctx.fillRect(0, sy(.5), W, S * .5);
    // ön grafikler
    questionMarks(t); typeTag(t); swatches(t); compGrid(t); certificate(t); stamp(t);
    burn(t);
  }
  if (full) {
    const ein = E.outQuint(prog(t, 5.95, 6.2));
    ctx.save();
    if (t < 8.33) { ctx.globalAlpha = ein; ctx.translate(cx, cy); ctx.scale(lerp(1.15, 1, ein), lerp(1.15, 1, ein)); ctx.translate(-cx, -cy); editorScene(t); }
    else { const pin = E.outQuint(prog(t, 8.28, 8.5)); ctx.translate(0, (1 - pin) * S * .15); ctx.globalAlpha = clamp(pin * 2); portfolioScene(t); }
    ctx.restore();
    pip(t, 6.1, 10.87, 1);
    // tam ekrandan çıkış
    const ex = prog(t, 10.75, 10.87);
    if (ex > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.sin(ex * Math.PI) * .6})`; ctx.fillRect(0, 0, W, H); }
  }
  for (const pg of PAGES) caption(pg, t);
  if (t >= FIN) finale(t);
  ctx.restore();
  glitch(t);
}

const SAMPLES = RENDER ? 3 : 1;
async function renderAt(t) {
  t = clamp(t, 0, DUR - 1e-4);
  if (SAMPLES === 1) { await drawScene(t); octx.globalAlpha = 1; octx.drawImage(buf, 0, OY, W, S, 0, 0, W, S); return; }
  const sh = 0.5 / FPS;
  for (let s = 0; s < SAMPLES; s++) {
    await drawScene(clamp(t + (s / (SAMPLES - 1) - .5) * sh, 0, DUR - 1e-4));
    octx.globalAlpha = 1 / (s + 1); octx.drawImage(buf, 0, OY, W, S, 0, 0, W, S);
  }
  octx.globalAlpha = 1;
}
window.renderAt = renderAt;

const LAT = 'U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD';
const EXT = 'U+0100-0130,U+0132-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF';
const faces = [
  new FontFace('Inter', 'url(fonts/inter-latin-wght-normal.woff2)', { weight: '100 900', unicodeRange: LAT }),
  new FontFace('Inter', 'url(fonts/inter-latin-ext-wght-normal.woff2)', { weight: '100 900', unicodeRange: EXT }),
  new FontFace('Anton', 'url(fonts/anton-latin-400-normal.woff2)', { unicodeRange: LAT }),
  new FontFace('Anton', 'url(fonts/anton-latin-ext-400-normal.woff2)', { unicodeRange: EXT }),
  new FontFace('Instrument Serif', 'url(fonts/instrument-serif-latin-400-italic.woff2)', { style: 'italic', unicodeRange: LAT }),
  new FontFace('Instrument Serif', 'url(fonts/instrument-serif-latin-ext-400-italic.woff2)', { style: 'italic', unicodeRange: EXT }),
];
window.ready = Promise.all(faces.map(f => f.load())).then(fs => {
  fs.forEach(f => document.fonts.add(f));
  return Promise.all([document.fonts.load('900 100px Inter', 'ğşıİ'), document.fonts.load('400 100px Anton', 'ĞŞİ'), document.fonts.load('italic 400 100px "Instrument Serif"', 'ğşı')]);
}).then(() => {
  if (!RENDER) {
    let t0 = performance.now(), busy = false;
    const loop = async now => { if (!busy) { busy = true; await renderAt(((now - t0) / 1000) % DUR); busy = false; } requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
  return true;
});
</script>
