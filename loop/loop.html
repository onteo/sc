<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>infoakademi — tek plan döngü</title>
<style>html,body{margin:0;background:#000;height:100%}body{display:grid;place-items:center}canvas{max-width:100vw;max-height:100vh}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/*
 * infoakademi — tek plan, kesmesiz, döngülü hareketli grafik (2048×1080, 60 fps, 36 sn = 66 vuruş @110 BPM)
 * Her şey yalnızca seek(t) ile çizilir (zamanlayıcı yok, biriken durum yok).
 * Tüm dönüşümler: 0.8 sn, cubic-bezier(.45,0,.15,1). Önceki içerik yalnızca dönüşümün ikinci yarısında söner.
 */
const Q = new URLSearchParams(location.search);
const W = 2048, H = 1080, cx = W / 2, cy = H / 2, FPS = 60, RENDER = Q.has('render');
const BPM = 110, BEAT = 60 / BPM, b = n => n * BEAT;
const DUR = b(66);

const COL = { bg1: '#f3f3f0', bg2: '#e3e3de', ink: '#151515', gray: '#6b6b66', blue: '#2563eb', green: '#22c55e', red: '#ff0033', yt: '#0f0f0f', ytCard: '#272727', ytText: '#f1f1f1', ytSub: '#aaaaaa' };

// ---- zaman çizelgesi (vuruş ızgarası) ----
const T = {
  click1: b(1), bar: b(1.5), circ: b(3.5), check: b(5), split: b(6.5),
  q: b(8), a: b(9.5), contract: b(15), merge: b(16.5), fold: b(18), drop: b(20),
  pull: b(21), play: b(23), cards: [23, 24.5, 26, 27.5, 29].map(b), grab: b(31), pan: b(32),
  chart: b(33.5), steps: [34, 35, 36, 37].map(b), clickPt: b(38), dive: b(38) + .08, congrats: b(39.5),
  stack: [41, 41.5, 42, 42.5, 43].map(b), badge: b(44), career: [45.5, 47, 48.5, 50].map(b), extend: b(51.5),
  cta: b(52), like: b(53.5), sub: b(55), bell: b(56.5), all: b(57.5), msg: b(58.5),
  toLine: b(60), toLogo: b(61.5), fold2: b(63), toBtn: b(64.5),
};
window.TIMELINE = T;

const out = document.getElementById('c'); out.width = W; out.height = H;
const octx = out.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const buf = mk(), ctx = buf.getContext('2d');

// ---- yardımcılar ----
const clamp = (x, a = 0, b2 = 1) => Math.min(b2, Math.max(a, x));
const prog = (t, a, c) => clamp((t - a) / (c - a));
const lerp = (a, c, p) => a + (c - a) * p;
function bez(p1x, p1y, p2x, p2y) {
  const cx_ = 3 * p1x, bx = 3 * (p2x - p1x) - cx_, ax = 1 - cx_ - bx;
  const cy_ = 3 * p1y, by = 3 * (p2y - p1y) - cy_, ay = 1 - cy_ - by;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let u = x;
    for (let i = 0; i < 10; i++) { const xt = ((ax * u + bx) * u + cx_) * u - x, dx = (3 * ax * u + 2 * bx) * u + cx_; if (Math.abs(xt) < 1e-6) break; if (Math.abs(dx) < 1e-6) break; u = clamp(u - xt / dx); }
    let lo = 0, hi = 1; for (let i = 0; i < 20 && Math.abs(((ax * u + bx) * u + cx_) * u - x) > 1e-5; i++) { u = (lo + hi) / 2; (((ax * u + bx) * u + cx_) * u < x) ? lo = u : hi = u; }
    return ((ay * u + by) * u + cy_) * u;
  };
}
const EZ = bez(.45, 0, .15, 1);
const MD = .8;                                    // dönüşüm süresi
const M = (t, a, d = MD) => EZ(prog(t, a, a + d)); // dönüşüm ilerlemesi
const OUT2 = (t, a, d = MD) => 1 - prog(t, a + d / 2, a + d); // eski içerik: ikinci yarıda söner
const IN2 = (t, a, d = MD) => prog(t, a + d / 2, a + d);      // yeni içerik: ikinci yarıda belirir
const smooth = x => x * x * (3 - 2 * x);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function mixC(a, c, p) {
  const A = parseInt(a.slice(1), 16), B2 = parseInt(c.slice(1), 16);
  const r = [16, 8, 0].map(s => Math.round(lerp(A >> s & 255, B2 >> s & 255, clamp(p))));
  return `rgb(${r[0]},${r[1]},${r[2]})`;
}
function hexA(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
function font(size, w = 600) { ctx.font = `${w} ${size}px Inter`; }
function measure(s, size, w = 600, tr = -0.015) { font(size, w); ctx.letterSpacing = `${tr * size}px`; const m = ctx.measureText(s).width; ctx.letterSpacing = '0px'; return m; }
function text(s, x, y, size, w, col, align = 'left', a = 1, tr = -0.015) {
  if (a <= 0) return;
  ctx.save(); font(size, w); ctx.letterSpacing = `${tr * size}px`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = col; ctx.globalAlpha *= a; ctx.fillText(s, x, y); ctx.restore();
}
function rr(x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function rrc(o) { rr(o.x - o.w / 2, o.y - o.h / 2, o.w, o.h, o.r); }  // merkezli
function circle(x, y, r, f) { if (r <= 0) return; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = f; ctx.fill(); }
function lerpBox(a, c, p) { const o = {}; for (const k of ['x', 'y', 'w', 'h', 'r']) o[k] = lerp(a[k], c[k], p); return o; }
// katmanlı yumuşak gölge
function softShadow(draw, strength = 1) {
  ctx.save(); ctx.shadowColor = `rgba(20,20,15,${.10 * strength})`; ctx.shadowBlur = 60; ctx.shadowOffsetY = 26; draw(); ctx.restore();
  ctx.save(); ctx.shadowColor = `rgba(20,20,15,${.08 * strength})`; ctx.shadowBlur = 8; ctx.shadowOffsetY = 2; draw(); ctx.restore();
}
function stageBg(a = 1) {
  ctx.save(); ctx.globalAlpha *= a;
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, COL.bg1); g.addColorStop(1, COL.bg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
}
// doğal yazma: kelime kelime, kelime uzunluğuna göre değişen ritim
function typed(str, t, t0, speed = 1) {
  const ws = str.split(' '); let acc = t0, outS = '';
  for (let i = 0; i < ws.length; i++) {
    acc += (0.05 + ws[i].length * 0.034 + hash(i + str.length) * 0.05) / speed;
    if (t < acc) break;
    outS += (i ? ' ' : '') + ws[i];
  }
  return outS;
}
function typedEnd(str, t0, speed = 1) { const ws = str.split(' '); let acc = t0; ws.forEach((w, i) => acc += (0.05 + w.length * 0.034 + hash(i + str.length) * 0.05) / speed); return acc; }

// ---- goo katmanı (bulanıklık + alfa eşiği) — yalnızca nokta ayrılma/birleşme ve sohbet→play ----
const GS = .5, goo1 = mk(W * GS, H * GS), g1 = goo1.getContext('2d'), goo2 = mk(W * GS, H * GS), g2 = goo2.getContext('2d', { willReadFrequently: true });
function goo(circles, color, alpha = 1) {
  g1.clearRect(0, 0, goo1.width, goo1.height); g1.fillStyle = '#000';
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y, r] of circles) { if (r <= 0) continue; g1.beginPath(); g1.arc(x * GS, y * GS, r * GS, 0, Math.PI * 2); g1.fill(); x0 = Math.min(x0, x - r); y0 = Math.min(y0, y - r); x1 = Math.max(x1, x + r); y1 = Math.max(y1, y + r); }
  const pad = 40, bx = Math.max(0, Math.floor((x0 - pad) * GS)), by = Math.max(0, Math.floor((y0 - pad) * GS));
  const bw = Math.min(goo1.width - bx, Math.ceil((x1 - x0 + pad * 2) * GS)), bh = Math.min(goo1.height - by, Math.ceil((y1 - y0 + pad * 2) * GS));
  if (bw <= 0 || bh <= 0) return;
  g2.clearRect(0, 0, goo2.width, goo2.height); g2.filter = 'blur(7px)'; g2.drawImage(goo1, 0, 0); g2.filter = 'none';
  const img = g2.getImageData(bx, by, bw, bh), d = img.data;
  const [R, G, B] = [1, 3, 5].map(i => parseInt(color.slice(i, i + 2), 16));
  for (let i = 0; i < d.length; i += 4) { const a = d[i + 3] / 255; const k = clamp((a - .42) / .12); d[i] = R; d[i + 1] = G; d[i + 2] = B; d[i + 3] = k * 255 * alpha; }
  g2.putImageData(img, bx, by);
  ctx.drawImage(goo2, bx, by, bw, bh, bx / GS, by / GS, bw / GS, bh / GS);
}

// ---- imleç (gerçek masaüstü işaretçisi) ----
let CUR = null;
function drawCursor() {
  if (!CUR || CUR.a <= 0) return;
  const { x, y, press = 0, a = 1 } = CUR, s = 1.55 * (1 - press * .1);
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(0,0,0,.28)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 22.5); ctx.lineTo(5.3, 17.4); ctx.lineTo(9.1, 25.8); ctx.lineTo(12.6, 24.2); ctx.lineTo(8.9, 16.1); ctx.lineTo(16, 16); ctx.closePath();
  ctx.fillStyle = '#000'; ctx.fill(); ctx.shadowColor = 'transparent'; ctx.lineWidth = 1.5; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.restore();
}
const pressAt = (t, T0) => Math.sin(prog(t, T0 - .06, T0 + .12) * Math.PI);
// imleç anahtar kareleri (ekran koordinatı): [zaman, x, y]
function keyPath(t, keys) {
  if (t <= keys[0][0]) return [keys[0][1], keys[0][2]];
  for (let i = 1; i < keys.length; i++) {
    const [ta, xa, ya] = keys[i - 1], [tb, xb, yb] = keys[i];
    if (t <= tb) { const e = EZ(prog(t, ta, tb)); return [lerp(xa, xb, e), lerp(ya, yb, e) - Math.sin(e * Math.PI) * Math.min(40, Math.hypot(xb - xa, yb - ya) * .06)]; }
  }
  const k = keys[keys.length - 1]; return [k[1], k[2]];
}

// ===================================================================================
// SAHNE 01 — başla butonu → yükleme çubuğu → dairesel ilerleme → onay → 3 nokta
// ===================================================================================
const BTN = { x: cx, y: cy - 20, w: 560, h: 108, r: 54 };
const HELP_Y = cy + 88;
function startButton(box, labelA, helpA, fill = COL.ink) {
  softShadow(() => { rrc(box); ctx.fillStyle = fill; ctx.fill(); }, 1);
  text('Online Eğitime Başla', box.x, box.y + 2, 38, 600, '#fff', 'center', labelA);
  text('Kariyerine yeni bir beceri ekle.', cx, HELP_Y, 28, 500, COL.gray, 'center', helpA);
}
function scene01(t) {
  stageBg();
  const BAR = { x: cx, y: cy - 20, w: 1120, h: 66, r: 33 }, CIR = { x: cx, y: cy - 20, w: 150, h: 150, r: 75 };
  if (t < T.bar) {
    const s = 1 - .045 * pressAt(t, T.click1);
    startButton({ ...BTN, w: BTN.w * s, h: BTN.h * s }, 1, 1);
    CUR = { ...xy(keyPath(t, [[0, 2200, 1180], [T.click1 - .05, BTN.x + 40, BTN.y + 12]])), press: pressAt(t, T.click1) };
    return;
  }
  // imleç tıklamadan sonra yavaşça çekilir
  if (t < T.bar + 1.2) CUR = { ...xy(keyPath(t, [[T.bar, BTN.x + 40, BTN.y + 12], [T.bar + 1.2, 1700, 1180]])) };
  let box, fillFrac, trackCol;
  if (t < T.circ) {
    const e = M(t, T.bar);
    box = lerpBox(BTN, BAR, e);
    trackCol = mixC(COL.ink, '#dcdcd6', e);
    fillFrac = lerp(1, .06, e) + .66 * smooth(prog(t, T.bar + .6, T.circ));
    softShadow(() => { rrc(box); ctx.fillStyle = trackCol; ctx.fill(); }, 1 - e * .6);
    // dolu kısım (siyah)
    ctx.save(); rrc(box); ctx.clip(); ctx.fillStyle = COL.ink; ctx.fillRect(box.x - box.w / 2, box.y - box.h / 2, box.w * fillFrac, box.h); ctx.restore();
    text('Online Eğitime Başla', box.x, box.y + 2, 38, 600, '#fff', 'center', OUT2(t, T.bar));
    text('Kariyerine yeni bir beceri ekle.', cx, HELP_Y, 28, 500, COL.gray, 'center', OUT2(t, T.bar));
    const la = IN2(t, T.bar);
    if (la > 0) {
      const s = 'Öğrenme alanın hazırlanıyor...';
      ctx.save(); rrc(box); ctx.clip();
      text(s, box.x, box.y + 1, 26, 600, COL.ink, 'center', la);
      ctx.beginPath(); ctx.rect(box.x - box.w / 2, box.y - box.h / 2, box.w * fillFrac, box.h); ctx.clip();
      text(s, box.x, box.y + 1, 26, 600, '#fff', 'center', la);
      ctx.restore();
    }
    return;
  }
  const RING = 12;
  if (t < T.check) {
    const e = M(t, T.circ);
    box = lerpBox(BAR, CIR, e);
    const barFill = .72;
    softShadow(() => { rrc(box); ctx.fillStyle = '#dcdcd6'; ctx.fill(); }, .4 + .6 * e);
    // çubuktaki dolgu ilk yarıda daireye çekilir, sonra halka devralır
    ctx.save(); rrc(box); ctx.clip(); ctx.globalAlpha = OUT2(t, T.circ); ctx.fillStyle = COL.ink; ctx.fillRect(box.x - box.w / 2, box.y - box.h / 2, box.w * barFill, box.h); ctx.restore();
    ctx.save(); rrc(box); ctx.clip(); text('Öğrenme alanın hazırlanıyor...', box.x, box.y + 1, 26, 600, COL.ink, 'center', OUT2(t, T.circ)); ctx.restore();
    const ra = IN2(t, T.circ);
    const pr = lerp(barFill, 1, smooth(prog(t, T.circ + .5, T.check - .05)));
    if (ra > 0) {
      ctx.save(); ctx.globalAlpha = ra; ctx.lineWidth = RING; ctx.lineCap = 'round';
      ctx.strokeStyle = COL.ink; ctx.beginPath(); ctx.arc(box.x, box.y, 75 - RING / 2 - 4, -Math.PI / 2, -Math.PI / 2 + pr * Math.PI * 2); ctx.stroke(); ctx.restore();
      text(`%${Math.round(pr * 100 / 5) * 5}`, box.x, box.y + 2, 30, 700, COL.ink, 'center', ra);
    }
    return;
  }
  if (t < T.split) {
    const e = M(t, T.check);
    softShadow(() => { rrc(CIR); ctx.fillStyle = '#dcdcd6'; ctx.fill(); }, 1);
    ctx.save(); ctx.globalAlpha = OUT2(t, T.check); ctx.lineWidth = RING; ctx.strokeStyle = COL.ink; ctx.beginPath(); ctx.arc(cx, CIR.y, 75 - RING / 2 - 4, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    text('%100', cx, CIR.y + 2, 30, 700, COL.ink, 'center', OUT2(t, T.check));
    circle(cx, CIR.y, 75 * e, COL.blue);
    checkMark(cx, CIR.y, 1, prog(t, T.check + .3, T.check + .8));
    text('Hazırsın.', cx, CIR.y + 150 + (1 - IN2(t, T.check)) * 14, 46, 700, COL.ink, 'center', IN2(t, T.check), -.02);
    return;
  }
  // üç noktaya ayrılma (goo)
  const e = M(t, T.split);
  const R = lerp(75, 26, e), off = 120 * e, rs = lerp(44, 26, e) * clamp(e * 4);
  goo([[cx, CIR.y, R], [cx - off, CIR.y, rs], [cx + off, CIR.y, rs]], COL.blue);
  ctx.save(); ctx.beginPath(); ctx.arc(cx, CIR.y, R, 0, Math.PI * 2); ctx.clip(); checkMark(cx, CIR.y, 1, 1, OUT2(t, T.split)); ctx.restore();
  text('Hazırsın.', cx, CIR.y + 150, 46, 700, COL.ink, 'center', OUT2(t, T.split), -.02);
}
const xy = ([x, y]) => ({ x, y });
function checkMark(x, y, s, p, a = 1) {
  if (p <= 0 || a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 11; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const A = [-30, 2], Bp = [-8, 24], Cp = [32, -20];
  ctx.beginPath(); ctx.moveTo(...A);
  if (p < .4) ctx.lineTo(lerp(A[0], Bp[0], p / .4), lerp(A[1], Bp[1], p / .4));
  else { ctx.lineTo(...Bp); const q = (p - .4) / .6; ctx.lineTo(lerp(Bp[0], Cp[0], q), lerp(Bp[1], Cp[1], q)); }
  ctx.stroke(); ctx.restore();
}

// ===================================================================================
// SAHNE 02 — sohbet: soru / cevap, sonra noktalar birleşir → play
// ===================================================================================
const DOT_Y = cy - 20, DOT_R = 26;
const QS = 'Online eğitimle gerçekten öğrenebilir miyim?', AS = 'Canlı dersler, uygulamalı eğitim ve uzman eğitmenlerle evet.', SUP = 'Üstelik istediğin yerden katılabilirsin.';
let QB, AB;
function chatLayout() {
  const qw = measure(QS, 42, 600) + 96, aw = measure(AS, 40, 500) + 96;
  QB = { x: 330 + qw / 2, y: 250, w: qw, h: 120, r: 38 };
  AB = { x: W - 330 - aw / 2, y: 780, w: aw, h: 120, r: 38 };
}
function bubble(box, fill, strength) { softShadow(() => { rrc(box); ctx.fillStyle = fill; ctx.fill(); }, strength); }
function scene02(t) {
  stageBg();
  const dotBox = (x) => ({ x, y: DOT_Y, w: DOT_R * 2, h: DOT_R * 2, r: DOT_R });
  const L = dotBox(cx - 120), Rr = dotBox(cx + 120);
  // orta nokta
  const mergeE = M(t, T.merge);
  if (t < T.merge) circle(cx, DOT_Y, DOT_R, COL.blue);
  // soru balonu
  let qBox, qCol, aBox, aCol;
  const qe = M(t, T.q), ae = M(t, T.a), ce = M(t, T.contract);
  const flight = (from, to, e, arc) => { const b2 = lerpBox(from, to, e); b2.y += arc * Math.sin(e * Math.PI); return b2; };
  if (t < T.contract) {
    // uçuş: önce konum, sonra genişleme (tek eğri üzerinde)
    qBox = flight(L, QB, qe, -60); qBox.w = lerp(L.w, QB.w, smooth(qe)); qCol = mixC(COL.blue, '#ffffff', qe);
    aBox = flight(Rr, AB, ae, 60); aBox.w = lerp(Rr.w, AB.w, smooth(ae)); aCol = mixC(COL.blue, COL.ink, ae);
  } else {
    qBox = lerpBox(QB, L, ce); qCol = mixC('#ffffff', COL.blue, ce);
    aBox = lerpBox(AB, Rr, ce); aCol = mixC(COL.ink, COL.blue, ce);
  }
  if (t < T.merge) {
    bubble(qBox, qCol, qe * (1 - ce));
    bubble(aBox, aCol, ae * (1 - ce));
  }
  // yazılar
  const qa = IN2(t, T.q) * (t < T.contract ? 1 : OUT2(t, T.contract));
  const qs = typed(QS, t, T.q + .55, 1.15);
  if (qa > 0) {
    ctx.save(); rrc(qBox); ctx.clip();
    text(qs, qBox.x - qBox.w / 2 + 48, qBox.y + 2, 42, 600, COL.ink, 'left', qa);
    if (qs.length < QS.length && Math.floor(t * 4) % 2 === 0) { ctx.fillStyle = COL.blue; ctx.globalAlpha = qa; ctx.fillRect(qBox.x - qBox.w / 2 + 52 + measure(qs, 42, 600), qBox.y - 24, 3, 48); }
    ctx.restore();
    text('Sen', qBox.x - qBox.w / 2 + 20, qBox.y - 92, 24, 600, COL.gray, 'left', qa);
  }
  const aa = IN2(t, T.a) * (t < T.contract ? 1 : OUT2(t, T.contract));
  const as = typed(AS, t, T.a + .6, 1.35);
  if (aa > 0) {
    ctx.save(); rrc(aBox); ctx.clip();
    text(as, aBox.x - aBox.w / 2 + 48, aBox.y + 2, 40, 500, '#fff', 'left', aa);
    ctx.restore();
    text('infoakademi', aBox.x + aBox.w / 2 - 20, aBox.y - 92, 24, 700, COL.blue, 'right', aa);
    const sa = prog(t, typedEnd(AS, T.a + .6, 1.35), typedEnd(AS, T.a + .6, 1.35) + .4) * (t < T.contract ? 1 : OUT2(t, T.contract));
    text(SUP, aBox.x + aBox.w / 2 - 20, aBox.y + 110 + (1 - sa) * 12, 30, 500, COL.gray, 'right', sa);
  }
  // birleşme (goo)
  if (t >= T.merge) {
    const off = 120 * (1 - mergeE);
    const Rm = lerp(DOT_R, 40, mergeE);
    const rs = DOT_R * (1 - smooth(prog(t, T.merge + .5, T.merge + .8)));
    goo([[cx, DOT_Y, Rm], [cx - off, DOT_Y, rs], [cx + off, DOT_Y, rs]], COL.blue);
  }
}

// ===================================================================================
// SAHNE 03 — nokta → play üçgeni, DROP'ta tıklama, koyu taşma, YouTube oynatıcıya geri çekilme
// ===================================================================================
function playShape(x, y, rad, e, col) {
  // noktadan üçgene: çevre noktaları tek tek katlanır
  const N = 90, pts = [];
  const tri = [[1, 0], [-.55, .9], [-.55, -.9]];
  for (let i = 0; i < N; i++) {
    const u = i / N, a = u * Math.PI * 2;
    const c = [Math.cos(a), Math.sin(a)];
    // üçgen çevresinde aynı parametre
    const seg = Math.floor(u * 3), f = u * 3 - seg, p0 = tri[seg], p1 = tri[(seg + 1) % 3];

    const lineH = 6;
    ctx.fillStyle = COL.ink; rr(cx - lineW / 2, lineY - lineH / 2, lineW, lineH, 3); ctx.globalAlpha = 1 - open * .85; ctx.fill(); ctx.globalAlpha = 1;
    if (open > 0) {
      // maske: çizginin üstünden yukarı doğru açılır
      ctx.save(); ctx.beginPath(); ctx.rect(0, lineY - (LG + 40) * open, W, (LG + 40) * open); ctx.clip();
      ctx.globalAlpha = clamp(open * 1.4);
      softShadow(() => { ctx.drawImage(LOGO, lx, ly - LG / 2, LG, LG); }, .6);
      font(F, 800); ctx.letterSpacing = `${-.045 * F}px`; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = COL.ink; ctx.fillText('info', lx + LG + gap, ly + LG / 2 - 8);
      ctx.fillStyle = COL.blue; ctx.fillText('akademi', lx + LG + gap + measure('info', F, 800, -.045), ly + LG / 2 - 8);
      ctx.letterSpacing = '0px'; ctx.restore();
      const ta = IN2(t, T.toLogo) * (t < T.fold2 ? 1 : 1 - prog(t, T.fold2, T.fold2 + .35));
      text('öğren. uygula. ilerle.', cx, ly + LG / 2 + 100, 36, 600, COL.blue, 'center', ta, -.01);
      text('Online eğitimler  •  Canlı dersler  •  Yeni beceriler', cx, ly + LG / 2 + 156, 24, 500, COL.gray, 'center', ta);
    }
    return;
  }
  // çizgi kalınlaşır → başla butonu
  const box = lerpBox({ ...LINE, w: BTN.w, y: BTN.y }, BTN, btnE);
  box.w = lerp(LINE.w, BTN.w, btnE); box.y = lerp(LINE.y, BTN.y, btnE);
  softShadow(() => { rrc(box); ctx.fillStyle = COL.ink; ctx.fill(); }, btnE);
  text('Online Eğitime Başla', box.x, box.y + 2, 38, 600, '#fff', 'center', IN2(t, T.toBtn));
  text('Kariyerine yeni bir beceri ekle.', cx, HELP_Y, 28, 500, COL.gray, 'center', IN2(t, T.toBtn));
}

// ===================================================================================
// ana çizim
// ===================================================================================
function drawScene(t, ft) {
  CUR = null;
  ctx.save(); ctx.letterSpacing = '0px';
  if (t < T.q) scene01(t);
  else if (t < T.drop) {
    scene02(t);
    if (t >= T.fold) {
      // birleşmiş nokta → play üçgeni
      stageBg(); const e = M(t, T.fold);
      playShape(cx, DOT_Y, lerp(40, 44, e), e, COL.blue);
    }
    // imleç play'e gider
    if (t > T.fold) CUR = { ...xy(keyPath(t, [[T.fold, 2150, 1150], [T.drop - .12, cx + 6, DOT_Y + 8]])), press: pressAt(t, T.drop) };
  } else if (t < T.congrats) {
    // koyu taşma + YouTube dünyası + analitik
    stageBg();
    // alan doğrusal büyür (r ∝ √ilerleme) → ekran tek karede kararmaz
    const fp = prog(t, T.drop, T.drop + .8), fr = Math.sqrt(fp * fp * (3 - 2 * fp)) * Math.hypot(W, H);
    ctx.fillStyle = COL.yt; ctx.beginPath(); ctx.arc(cx + 6, DOT_Y + 8, fr, 0, Math.PI * 2); ctx.fill();
    camera(t);
    const contentA = IN2(t, T.pull);
    // taşma bitene kadar tüm YouTube dünyası taşma dairesinin içinde kalır
    ctx.save();
    if (t < T.drop + .8) { ctx.beginPath(); ctx.arc(cx + 6, DOT_Y + 8, Math.max(1, fr), 0, Math.PI * 2); ctx.clip(); }
    withCam(() => {
      if (t < T.pan + MD + .2) ytPage(t, ft, contentA);
      analytics(t, ft);
      progressLine(t);
      // oynatıcı ortasındaki play düğmesi (tıklama yüzeyinden gelir)
      const pa = t < T.play ? 1 : OUT2(t, T.play, .5);
      if (pa > 0) {
        const r = PLAY_R * lerp(0, 1, EZ(prog(t, T.drop - .02, T.drop + .15)));
        ctx.save(); ctx.globalAlpha = pa; circle(PC[0], PC[1], r, '#fff');
        ctx.restore();
      }
    });
    ctx.restore();
    // play üçgeni ekran uzayında: tıklama anındaki konumdan kamerayla birlikte küçülür
    const pa = t < T.play ? 1 : OUT2(t, T.play, .5);
    if (pa > 0) {
      const [sx, sy] = toScr(PC[0], PC[1]);
      ctx.save(); ctx.globalAlpha = pa;
      playShape(sx + lerp(-6, 4, prog(t, T.drop, T.drop + .3)) * CAM.z / (70 / PLAY_R), sy, 30 * CAM.z / (70 / PLAY_R) * 1.4, 1, mixC(COL.blue, COL.yt, prog(t, T.drop, T.drop + .25)));
      ctx.restore();
    }
    // imleç: play → ilerleme noktası → sürükle (noktaya bağlı) → son nokta
    const knob = toScr(tipX(t), PB.y);
    if (t < T.grab - .55) CUR = { ...xy(keyPath(t, [[T.drop, cx + 6, DOT_Y + 8], [T.pull + .8, 1250, 700], [T.grab - .55, 1250, 700]])), press: pressAt(t, T.drop) };
    else if (t < T.grab) { const [kx, ky] = toScr(lerp(PB.x0, PB.x1, playProgress(T.grab)), PB.y); CUR = xy(keyPath(t, [[T.grab - .55, 1250, 700], [T.grab - .05, kx, ky]])); }
    else if (t < T.pan + MD) CUR = { x: knob[0], y: knob[1], press: .6 };
    else if (t < T.dive) { const [fx, fy] = toScr(WK[3], WY[3]); CUR = { ...xy(keyPath(t, [[T.pan + MD, knob[0], knob[1]], [T.steps[3] + .6, 1350, 900], [T.clickPt - .1, fx + 4, fy + 4]])), press: pressAt(t, T.clickPt) }; }
    else { const [fx, fy] = toScr(WK[3], WY[3]); CUR = { x: fx + 4, y: fy + 4, a: 1 - prog(t, T.dive, T.dive + .3) }; }
    // dalış: yeşil nokta ekranı doldurur, sonra sıcak sahneye geçer
    if (t >= T.dive) { const k = prog(t, T.dive + .45, T.dive + .8); if (k > 0) { ctx.save(); ctx.globalAlpha = k; ctx.fillStyle = COL.green; ctx.fillRect(0, 0, W, H); ctx.restore(); } }
  } else if (t < T.career[0] + MD && t < T.career[0] + MD) {
    scene07(t);
    // yeşilden sıcak sahneye
    const g = 1 - prog(t, T.congrats - .05, T.congrats + .4);
    if (g > 0) { ctx.save(); ctx.globalAlpha = g; ctx.fillStyle = COL.green; ctx.fillRect(0, 0, W, H); ctx.restore(); }
    if (t >= T.career[0]) { /* rozet kariyer sahnesine devreder */ ctx.save(); ctx.globalAlpha = prog(t, T.career[0] + .4, T.career[0] + .8); scene08(t); ctx.restore(); }
  } else if (t < T.cta) scene08(t);
  else if (t < T.toLogo) {
    scene09(t, ft);
    // imleç: Beğen → Abone Ol → zil → Tümü → dışarı
    const L = CTA.x - CTA.w / 2, Tp = CTA.y - CTA.h / 2, ly = Tp + 200;
    const likeP = [L + 130, ly + 34], subP = [L + CTA.w - 60 - 105, ly + 34], bellP = [L + CTA.w - 60 - 32, ly + 34], allP = [CTA.x + CTA.w / 2 - 92 - 200, CTA.y + CTA.h / 2 + 42];
    CUR = { ...xy(keyPath(t, [[T.cta + .3, 2150, 1150], [T.like - .08, ...likeP], [T.sub - .08, ...subP], [T.bell - .08, ...bellP], [T.all - .08, ...allP], [T.toLine, 2150, 1150]])), press: Math.max(pressAt(t, T.like), pressAt(t, T.sub), pressAt(t, T.bell), pressAt(t, T.all)) };
  } else scene10(t);
  drawCursor();
  ctx.restore();
}

// hareket bulanıklığı: normalde 4, en hızlı kamera kaydırmasında 12 alt kare (ileri yarım kare obtüratör)
function subframes(t) { return (t > T.pan - .05 && t < T.pan + MD + .05) || (t > T.dive && t < T.dive + MD) ? 12 : 4; }
function renderAt(ft) {
  ft = clamp(ft, 0, DUR - 1e-4);
  const S = RENDER ? subframes(ft) : 1;
  if (S === 1) { drawScene(ft, ft); octx.globalAlpha = 1; octx.drawImage(buf, 0, 0); return; }
  const sh = .5 / FPS;
  for (let s = 0; s < S; s++) { drawScene(ft + s / S * sh, ft); octx.globalAlpha = 1 / (s + 1); octx.drawImage(buf, 0, 0); }
  octx.globalAlpha = 1;
}
window.renderAt = renderAt; window.seek = renderAt; window.DUR = DUR;

const LAT = 'U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD';
const EXT = 'U+0100-0130,U+0132-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF';
const faces = [
  new FontFace('Inter', 'url(../animation/fonts/inter-latin-wght-normal.woff2)', { weight: '100 900', unicodeRange: LAT }),
  new FontFace('Inter', 'url(../animation/fonts/inter-latin-ext-wght-normal.woff2)', { weight: '100 900', unicodeRange: EXT }),
];
window.ready = Promise.all([...faces.map(f => f.load()), new Promise(r => { const i = new Image(); i.onload = () => { LOGO = i; r(); }; i.src = 'logo.png'; })])
  .then(fs => { fs.slice(0, 2).forEach(f => document.fonts.add(f)); return document.fonts.load('800 100px Inter', 'ğşıİüö'); })
  .then(() => {
    chatLayout();
    if (!RENDER) { const t0 = performance.now(); const loop = now => { renderAt(((now - t0) / 1000) % DUR); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
    return true;
  });
</script>
